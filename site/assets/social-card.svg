    <rect width="58" height="58" rx="16" fill="#4b5cff"/>
    <rect x="12" y="26" width="8" height="20" rx="4" fill="#f6f7fb"/>
    <rect x="25" y="18" width="8" height="28" rx="4" fill="#f6f7fb"/>
    <rect x="38" y="29" width="8" height="17" rx="4" fill="#f6f7fb"/>
    <circle cx="42" cy="16.5" r="6.5" fill="#b7f5d0"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="145" y="104" fill="#f6f7fb" font-size="32" font-weight="700" letter-spacing="-.8">Sprint Goals</text>
    <text x="70" y="214" fill="#b7f5d0" font-size="13" font-weight="700" letter-spacing="2.3">VOS OBJECTIFS, AU PREMIER PLAN</text>
    <text x="67" y="294" fill="#f6f7fb" font-size="61" font-weight="700" letter-spacing="-2.2">Donnez un cap</text>
    <text x="67" y="364" fill="#f6f7fb" font-size="61" font-weight="700" letter-spacing="-2.2">à votre Jira<tspan fill="#b7f5d0">.</tspan></text>
    <text x="70" y="418" fill="#aeb7d5" font-size="21">Moins de dispersion. Plus de sens.</text>
    <g transform="translate(70 511)">
      <rect width="81" height="34" rx="17" stroke="#465074"/>
      <text x="40.5" y="22" fill="#e1e5f2" font-size="14" text-anchor="middle">Scrum</text>
      <rect x="91" width="92" height="34" rx="17" stroke="#465074"/>
      <text x="137" y="22" fill="#e1e5f2" font-size="14" text-anchor="middle">Kanban</text>
      <rect x="193" width="75" height="34" rx="17" stroke="#465074"/>
      <text x="230.5" y="22" fill="#e1e5f2" font-size="14" text-anchor="middle">Daily</text>
    </g>
