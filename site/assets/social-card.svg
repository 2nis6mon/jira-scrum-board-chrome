<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sprint Goals — Donnez un cap à votre Jira.</title>
  <desc id="description">Des objectifs partagés, un board lisible. Illustration abstraite d’un board Scrum et Kanban, sans données réelles.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1050 100) rotate(132) scale(790 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4b5cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="654" y1="138" x2="1125" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20294d"/>
      <stop offset="1" stop-color="#151c39"/>
    </linearGradient>
    <filter id="shadow" x="580" y="88" width="620" height="485" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020411" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#0b1026"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1120" cy="-60" r="290" stroke="#b7f5d0" stroke-opacity=".12"/>
  <circle cx="1120" cy="-60" r="360" stroke="#b7f5d0" stroke-opacity=".06"/>
