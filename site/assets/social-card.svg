      <rect x="674" y="405" width="127" height="43" rx="6" fill="#303b66"/>
      <rect x="684" y="416" width="90" height="4" rx="2" fill="#8c99bf"/>
      <rect x="684" y="427" width="61" height="4" rx="2" fill="#65749e"/>
      <rect x="823" y="405" width="127" height="43" rx="6" fill="#303b66"/>
