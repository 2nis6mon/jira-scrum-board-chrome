      <rect x="972" y="285" width="127" height="43" rx="6" fill="#b7f5d0"/>
      <path d="m984 307 4 4 8-9" stroke="#216140" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1005" y="300" width="72" height="4" rx="2" fill="#438465"/>
      <rect x="1005" y="311" width="45" height="4" rx="2" fill="#76ae90"/>
